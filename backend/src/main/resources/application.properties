server.port=${SERVER_PORT:8085}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/medchain}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET:change-this-secret-change-this-secret-change-this-1234567890}
app.jwt.expiration-ms=28800000
app.cors.allowed-origin=${CORS_ORIGIN:http://localhost:4200}

# Ethereum network. The key and contract address have no defaults: generate a key with `npm run keygen` in blockchain/
# and use the address printed by `npm run deploy`.
app.chain.rpc-url=${CHAIN_RPC_URL:http://127.0.0.1:8545}
app.chain.private-key=${CHAIN_PRIVATE_KEY}
app.chain.contract-address=${CHAIN_CONTRACT_ADDRESS}
app.chain.chain-id=${CHAIN_ID:1337}

app.seed.admin-username=admin
# Blank = a random password is generated and logged once, the first time the admin account is created.
app.seed.admin-password=${ADMIN_PASSWORD:}
